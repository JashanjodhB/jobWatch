[project]
name = "jobwatch"
version = "2.0.0"
description = "Self-hosted internship posting monitor: Discord alerts and a local triage UI"
readme = "README.md"
requires-python = ">=3.12"

# Core. The service must run on exactly these. Anything else is an extra, and a
# missing extra degrades one adapter rather than crashing the process (§3).
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # FastAPI needs this to read HTML form posts; every write in the UI is one.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
html = ["selectolax>=0.3.21"]
browser = ["playwright>=1.44"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.5",
    "selectolax>=0.3.21",
]

[project.scripts]
jobwatch = "jobwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:jobwatch.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# A standalone dev script the repo ships as-is.
extend-exclude = ["verify_sources.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # Typographic dashes and quotes are deliberate in user-facing strings.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals on purpose and import fixtures by name.
"tests/*" = ["B011", "E402"]
