# jobwatch — expansion candidates
#
# Every entry below was probed against its live endpoint on 2026-08-14 and
# returned postings. This file is NOT loaded by anything; it is a staging area.
# Move the blocks you want into config/companies.yaml, or add them from the
# Companies screen.
#
# Re-verify before committing:
#     python verify_sources.py config/companies-expansion.yaml
#
# TIERING. Everything here is `warm` except the quant desks, which close intern
# reqs within hours of posting. config/companies.yaml says the hot tier should
# stay near 30 and it is already at 24 enabled, so promoting more than the quant
# block means demoting something first — the large Workday tenants (Capital One
# at ~54 requests a scan, Salesforce, Adobe) are the obvious candidates, since
# they leave reqs open for weeks and cost the most per poll.
#
# WORKDAY COUNTS ARE FUZZY. Workday's searchText matches substrings, so a search
# for "intern" also returns "International", "Internal Audit" and "Internet".
# Each Workday note records how many of the first 20 results are genuinely
# intern reqs — treat that ratio, not the total, as the signal.
#
# SEASONALITY. Probed 14 August. Summer-2027 campus reqs mostly open between
# late August and October, so a board reading 0 interns today is normal and is
# still worth polling — that is the point of watching it.


