# jobwatch — seed classification rules (§8)
#
# Seeded into the `filter_rules` table on first run. After that the table is
# owned by the filter workbench in the UI; edit there and use
# `jobwatch export-config` (or the UI export button) to write back here.
#
# Patterns are Python regex, matched case-insensitively against the ORIGINAL
# posting title — not the normalized one — so patterns like '\b20\d\d\s+summer\b'
# still work. The two `location_*` kinds are matched against each location
# string instead. Use an inline '(?-i:...)' group where case actually matters,
# as the US abbreviations below do.
#
# Evaluation order:
#   every location excluded              -> reject     (location-dependent)
#   no location satisfies location_require -> reject   (location-dependent)
#   any exclude_any hit                  -> reject
#   no require_any hit                   -> reject
#   require_any hit AND role_any hit     -> match
#   require_any hit, no role_any hit     -> review
#
# Location screening runs first and is never cached — the verdict cache is keyed
# on the normalized title, which says nothing about where the job is.

require_any:
  - '\bintern(ship)?\b'
  - '\bco-?op\b'
  - '\bsummer analyst\b'
  - '\bindustrial placement\b'
  - '\bapprentice\b'
  - '\b20\d\d\s+summer\b'
  # ByteDance/TikTok and Google label real ML and SWE internships "Student
  # Researcher", and John Deere, Zoox and Daktronics use a bare "... Student".
  # Without these the whole naming family is dropped as "not an internship":
  # it was 96 of the 220 title-rejected roles in the Simplify feed (2026-08-25).
  # University research assistantships also match, but jobwatch only ever
  # classifies postings from companies in its own registry, so that noise
  # cannot reach it.
  - '\bstudent researcher\b'
  - '\b(part[- ]?time\s+)?student\b'

role_any:
  # This is the tech gate. A require_any hit WITHOUT a hit here is 'review', not
  # 'match' — so this list is what decides whether a posting alerts at all.
  #
  # Rewritten 2026-08-27. It used to carry a bare '\bengineer(ing)?\b', which
  # made every discipline on earth a match: Mining, Mechanical, Civil,
  # Structural, Welding and Facilities engineering internships all alerted as
  # "tech". Engineering now only qualifies when the discipline is a computing
  # one; bare "Engineering Intern" falls to review, where it can be triaged.

  # ── Software & computer science ──────────────────────────────────────
  - '\bsoftware\b'
  - '\b(swe|sde|sdet|mle)\b'
  - '\bcomputer sci(ence)?\b'
  - '\b(developer|programmer|programming)\b'
  - '\b(back[- ]?end|front[- ]?end|full[- ]?stack)\b'
  - '\bweb\b'
  - '\b(ios|android)\b'
  - '\bapplication (developer|development|engineer(ing)?)\b'

  # ── AI, ML & data ────────────────────────────────────────────────────
  - '\bmachine learning\b'
  - '\bdeep learning\b'
  - '\b(ai|ml|nlp|llm|gen ?ai)\b'
  - '\bdata\b'
  - '\banalytics\b'
  - '\b(computer vision|perception)\b'
  - '\bresearch (engineer|scientist)\b'
  - '\bquantitative (developer|technologist)\b'

  # ── Infrastructure, cloud, security & networks ───────────────────────
  - '\b(infrastructure|platform|systems?)\b'
  - '\b(cloud|devops|sre|site reliability)\b'
  - '\b(cyber ?security|information security|infosec)\b'
  - '\bsecurity engineer(ing)?\b'
  - '\bnetwork(ing|s)?\b'
  - '\b(database|sql)\b'

  # ── Computing hardware ───────────────────────────────────────────────
  # Chip and firmware work is CS-adjacent and was reaching only 'review'.
  - '\b(embedded|firmware|fpga|asic|vlsi|rtl|silicon)\b'
  - '\brobotics\b'
  - '\b(electrical|computer|hardware) engineer(ing)?\b'

  # ── IT & QA ──────────────────────────────────────────────────────────
  # 'IT' MUST stay case-sensitive: an unanchored '\bit\b' matches the English
  # pronoun and would make every title a match.
  - '(?-i:\bIT\b)'
  - '\binformation technology\b'
  - '\b(qa|quality assurance|test automation)\b'
  - '\btechnolog(y|ies|ical)\b'
  # The lookbehind is load-bearing: without it "Student Intern - Non Technical"
  # classifies as a match.
  - '\b(?<!non[- ])technical\b'

exclude_any:
  - '\bph\.?d\b'
  - '\breturning intern\b'
  - '\bmba\b'
  - '\b(sales|marketing|recruit(ing|er))\b'
  - '\bnew ?grad\b'
  # '\bmanager\b' was removed 2026-08-25. It rejected 25 genuine "Product
  # Manager Intern" roles (mostly ByteDance/TikTok) while the near-identical
  # "Product Management Intern" only reached review — the same job, two
  # verdicts. Dropping it costs nothing in precision: require_any gates first,
  # so a plain "Engineering Manager" is still rejected for not being an
  # internship at all. Better to triage a few product roles than lose real ones.

  # ── Non-computing disciplines, added 2026-08-27 ──────────────────────
  # exclude_any is a HARD reject evaluated BEFORE role_any, so everything here
  # must be a term that essentially never co-occurs with a real tech role.
  # Measured against all 142,130 postings in the database: exactly two titles
  # carrying a strong tech token are lost to these patterns
  # ("Web Developer/Programmer Intern/Volunteer" and "School internship - HR
  # Data & Technology"). That was the acceptance test — anything that killed
  # more was dropped from this list.
  #
  # Deliberately NOT here, because each one does co-occur with real data work:
  # 'tax' (Digital Tax Data Scientist), 'supply chain' (Data Analytics in
  # Supply Chain), 'clinical', 'communications', 'treasury'. Those fall to
  # review instead, which is the correct place for a judgement call.
  - '\b(mechanical|civil|structural|chemical|mining|petroleum|geolog\w+|environmental|industrial|manufacturing|aerospace|automotive|nuclear|welding|hvac|architectural|process|packaging|facilities|geotechnical|safety)\s+(design\s+)?engineer(ing)?\b'
  - '\b(human resources|hr)\b'
  - '\b(accountant|accounting|bookkeep\w+|payroll|actuarial|underwrit\w+|claims adjust\w+)\b'
  - '\b(nurse|nursing|pharmac\w+|dental|medical assistant|phlebotom\w+)\b'
  - '\b(hair stylist|makeup|photographer|videographer|copy ?editor|journalis\w+|art director|graphic design\w*|copywrit\w+|retouch\w*)\b'
  - '\b(paralegal|attorney|immigration)\b'
  - '\b(social media|public relations)\b'
  - '\b(warehouse|janitor\w*|maintenance technician|barista|cashier)\b'
  # Unpaid "Intern/Volunteer" listings, which one registry org posts in bulk.
  - '\bvolunteer\b'

# A deny list: a posting is rejected only when EVERY one of its locations is hit.
# Largely redundant now that location_require is set, but harmless and still the
# right tool for excluding a specific city inside an otherwise-allowed country.
location_exclude:
  - 'India'
  - 'Poland'
  - 'Ireland'

# An allow list: United States only. A posting is rejected when it has locations
# and NOT ONE of them matches anything here. A posting with no location at all is
# never rejected — an adapter that failed to parse a location must not silently
# cost you a posting.
#
# Tuned against all 1,717 distinct location strings this database has seen.
# Two-letter state codes require a preceding comma, because Amazon writes
# 'DE, BY, Munich' (Germany) and 'IN, KA, Bengaluru' (India) — matched
# unanchored, those read as Delaware and Indiana. '\bUS\b' already covers
# Amazon's genuine 'US, CA, Santa Clara' form.
location_require:
  - '\bUnited States\b'
  - '(?-i:\b(?:U\.?S\.?A|USA)\b)'
  - '(?-i:\bUS\b)'
  - '\b(?:Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming)\b'
  - '(?-i:,\s*(?:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\b)'
  - '(?-i:\b(?:NYC|SF|SEA|CHI)\b)'
  # Bare city names, for the boards that print no state or country at all.
  - '\b(?:San Francisco|San Jose|San Mateo|San Diego|Santa Clara|Santa Monica|Sunnyvale|Mountain View|Menlo Park|Palo Alto|Cupertino|Berkeley|Oakland|Los Angeles|Irvine|Seattle|Bellevue|Redmond|Kirkland|New York|Brooklyn|Boston|Somerville|Austin|Dallas|Plano|Houston|Chicago|Denver|Boulder|Atlanta|Miami|Philadelphia|Pittsburgh|Phoenix|Tempe|Scottsdale|Portland|Minneapolis|Detroit|Nashville|Raleigh|Durham|Charlotte|Columbus|Ann Arbor|Madison|Salt Lake City|Arlington|McLean|Reston|Herndon|Bentonville|St\. Louis|Kansas City|Indianapolis)\b'
  # Placeholders that carry no geography at all. These are not "United States",
  # they are UNKNOWN — and an unknown location must not be silently dropped.
  # '2 Locations' alone accounts for ~700 postings on Greenhouse boards.
  - '^\s*(?:\d+\s+Locations?|Hybrid|Remote|Distributed|In-?Office|N/?A|Flexible|Various)\s*$'
