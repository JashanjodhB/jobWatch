# ═════════════════════════════════════════════════════════════════════════
# DIRECT — company-owned careers endpoints, built from the §5 DevTools recipe
# ═════════════════════════════════════════════════════════════════════════

- slug: amazon
  display_name: Amazon
  tier: hot
  careers_url: https://www.amazon.jobs/en/search?base_query=intern
  sources:
    - adapter: direct.amazon          # verified: www.amazon.jobs/en/search.json
      priority: 1
      config:
        base: https://www.amazon.jobs
        query: "intern"
      fallback_adapter: html
      fallback_config:
        url: https://www.amazon.jobs/en/search?base_query=intern
        job_selector: "div.job-tile a"

- slug: apple
  display_name: Apple
  tier: hot
  careers_url: https://jobs.apple.com/en-us/search
  sources:
    - adapter: direct.apple           # verified: POST jobs.apple.com/api/v1/search
      priority: 1
      config:
        base: https://jobs.apple.com
        # "intern" matches ~1825 roles (Apple's search is fuzzy enough to hit
        # "IN-Business Expert"); "internship" returns ~100.
        query: "internship"
      fallback_adapter: browser

- slug: uber
  display_name: Uber
  tier: hot
  careers_url: https://www.uber.com/us/en/careers/list/
  sources:
    - adapter: direct.uber            # verified: POST /api/loadSearchJobsResults
      priority: 1
      config:
        base: https://www.uber.com
        query: "intern"
      fallback_adapter: browser

