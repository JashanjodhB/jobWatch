# ── Radancy / TalentBrew — server-rendered, `html` adapter ──────────────
# Radancy makes no XHR at all: a Playwright sniff of four tenants found zero
# job JSON. Every listing is in the first response, so no browser is needed.
#
# The one thing that must not be got wrong: **the keyword lives in the query
# string, not the path.** `/search-jobs/intern?p=2` silently drops the filter
# and pages through the whole unfiltered board — l3harris went from 110 intern
# hits to 1930 assorted reqs that way. `/search-jobs?k=intern&p=2` keeps it.
# Every tenant exposes data-total-results on <section id="search-results">,
# which is how these counts were checked.
#
# Two skins exist. The classic one is `li > a > h2` + span.job-location; the
# newer one (McKesson) is a.search-results__job-title-link with no h2.

