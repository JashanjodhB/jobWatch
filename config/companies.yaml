# jobwatch — hot-tier seed registry
#
# Verified against live endpoints. Every entry below was actually called; the
# posting counts in the comments are what it returned at the time of writing.
#
# Re-verify with:
#     uv run python verify_sources.py config/companies.yaml
#
# Sources are polled in full and unioned. `priority: 1` is the canonical apply
# path — it decides which URL the Discord alert links to, not which sources get
# polled. Where a company has both its own careers endpoint and an ATS board,
# both are listed: they do not always carry the same postings.
#
# `min_interval_seconds` inside a source's config puts a floor on its poll
# interval regardless of tier. Use it for endpoints that cost many requests per
# poll — a full Workday scan of a large tenant is ~46 requests, and running that
# every 60 seconds from a residential IP is how you get blocked (§13.5).

