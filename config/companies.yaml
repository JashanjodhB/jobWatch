- slug: lockheed-martin
  display_name: Lockheed Martin
  tier: warm
  careers_url: https://lockheedmartin.eightfold.ai/careers
  notes: >-
    lockheedmartinjobs.com is a meta-refresh stub that lands on a 404, which is
    why URL fingerprinting finds nothing. The real board is Eightfold's "pcsx"
    flavour on lockheedmartin.eightfold.ai. /api/apply/v2/jobs answers 403 for
    every domain value -- only /api/pcsx/search works, and only with
    domain=lockheedmartin.com (lmco.com 404s).
  sources:
    - adapter: eightfold         # verified 2026-09-08: 21 hits for 'intern', 1 match/review
      priority: 1
      config:
        base: https://lockheedmartin.eightfold.ai
        domain: lockheedmartin.com
        path: /api/pcsx/search
        # `intern` is the right query here even though most of the 21 are
        # "International ..." noise the classifier rejects: it is the only
        # variant that returns all four real early-career reqs. `internship`
        # narrows to 8 and loses the three Apprentice ones; `university` and
        # `student` are so broad they blow past the adapter's 30-page guard.
        query: intern

