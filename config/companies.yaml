# ═════════════════════════════════════════════════════════════════════════
# NOTES ON TIERING
#
# Cost is dominated by Workday, not by company count. Measured from poll_log:
# a single-request board averages ~1.0s per poll; a Workday scan averages 45ms
# per posting, so NVIDIA is ~50s and Citi would be ~72s. Because the semaphore
# in pipeline.py wraps the entire paginated fetch, one Workday tenant occupies
# a concurrency slot for that whole time.
#
# With Workday on cold and everything else on warm, 196 companies cost roughly
# what 24 cost before. Promoting the Workday block to warm would nearly
# quintuple outbound requests for no gain — those tenants leave reqs open for
# weeks.
#
# The hot tier is now 34 enabled (20 original, after the four Workday tenants
# moved to cold, plus 14 quant) and 40 counting the six parked behind the
# browser fallback. All 14 additions are single-request Greenhouse boards, so
# the hot sweep is ~3s of work against a 60s budget. Do not promote a company
# here because it is prestigious; promote it because its postings close fast.
#
# Add more with `jobwatch discover <careers_url>`, which identifies the platform
# and verifies the guess against the live endpoint before you commit it.
# ═════════════════════════════════════════════════════════════════════════
