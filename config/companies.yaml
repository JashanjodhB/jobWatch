- slug: interlune
  display_name: Interlune
  tier: cold
  careers_url: https://www.interlune.space/careers
  sources:
    - adapter: html              # verified 2026-09-08: 2 postings, 0 match/review
      priority: 1                # Webflow; roles are server-rendered as /open-positions/<slug>
      config:
        url: https://www.interlune.space/careers
        base_url: https://www.interlune.space
        # The anchor wraps the meta line as well as the title, so without a
        # title_selector every title arrives as "Full Time - <city> <role>".
        job_selector: "a[href*='/open-positions/']"
        title_selector: "p.heading-style-h5"
        location_selector: ".news_card-details p:last-child"

