# ═════════════════════════════════════════════════════════════════════════
# ORACLE RECRUITING CLOUD — verified working
# Public, unauthenticated, stable `Id`, real `PostedDate`.
#
# The pod host is NOT derivable from the company domain: careers.<company>.com
# 302s to an opaque Oracle host. Follow that redirect once and record the
# result as `pod`. Identify an ORC tenant by `/sites/CX_<n>` in its careers URL.
#
# `limit` is honoured up to at least 200, so a whole board is one or two
# requests — cheap enough for warm without a min_interval_seconds floor.
# ═════════════════════════════════════════════════════════════════════════

- slug: american-express
  display_name: American Express
  tier: warm
  careers_url: https://careers.americanexpress.com/en/sites/CX_1/jobs
  sources:
    - adapter: oracle                 # verified: 247 hits for 'intern'; 2027 campus SWE reqs posted 2026-08-17/18
      priority: 1
      config:
        pod: https://egug.fa.us2.oraclecloud.com
        site_number: CX_1
        site_url: https://careers.americanexpress.com/en/sites/CX_1
        keyword: intern
        limit: 200

# ═════════════════════════════════════════════════════════════════════════
# AVATURE — requires the browser extra
#
# Avature answers plain HTTP with 202 and an empty body: it serves listings only
# after a JavaScript challenge. IBM's own careers site is client-rendered and
# exposes no public JSON, so Playwright is the only way in. Install with:
#     uv sync --extra browser && uv run playwright install chromium
#
# Four URL parameters carry the whole configuration, and all four were checked
# against the live board on 2026-08-18:
#
#   jobSearch=intern         filters server-side; without it the page is
#                            alphabetical across every IBM req worldwide
#   jobRecordsPerPage=48     the maximum. The dropdown offers only 9/12/24/48 --
#                            any other value silently falls back to 9
#   jobSort=postedDate       ASCENDING on its own: the first result was posted
#                            16-Dec-2025, so newest reqs land on the last page
#   jobSortDirection=desc    the half that matters. With it the first result was
#                            posted 18-Aug-2026, i.e. that day
#
# The adapter fetches one page, so newest-first is what makes a 48-row window a
# monitor rather than a sample. If IBM alerts ever go quiet, re-check the sort
# direction first.
#
# Each job renders FOUR anchors to the same href — category, title, level and
# location, and an empty apply button. `a[href*='JobDetail']` therefore reads
# the category as the title ("Consulting", "Software Engineering"); the title
# lives under `.article__header__text__title`.
# ═════════════════════════════════════════════════════════════════════════

- slug: ibm
  display_name: IBM
  tier: warm
  careers_url: https://careers.ibm.com/en_US/careers/SearchJobs
  notes: >-
    Avature behind a JS challenge, so this needs the Playwright extra; plain
    HTTP returns 202 with a zero-byte body. ibmglobal.avature.net redirects to
    careers.ibm.com, which is the canonical host.
  sources:
    - adapter: browser
      priority: 1
      config:                       # verified 2026-08-18: 48 postings, newest first
        url: https://careers.ibm.com/en_US/careers/SearchJobs/?jobSearch=intern&jobRecordsPerPage=48&jobSort=postedDate&jobSortDirection=desc
        job_selector: ".article__header__text__title a"
        base_url: https://careers.ibm.com
        wait_ms: 8000
        min_interval_seconds: 900

