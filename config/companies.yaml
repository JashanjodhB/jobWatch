# ═════════════════════════════════════════════════════════════════════════
# NEEDS THE BROWSER FALLBACK — disabled until Playwright is installed
#
#     uv sync --extra browser && uv run playwright install chromium
#     then enable them on the Companies screen.
#
# Each of these was probed and has no usable unauthenticated JSON endpoint:
# the page is rendered client-side, sits behind a bot check, or serves its API
# from a host whose TLS certificate does not match. `xhr_contains` is the
# request substring to intercept once a browser has run the page (§11).
#
# They are disabled rather than deleted so the config records what was tried.
# Enabling one without Playwright installed is harmless — the source is skipped
# with a log line, not an error (§3).
# ═════════════════════════════════════════════════════════════════════════

- slug: google
  display_name: Google
  tier: hot
  enabled: false
  careers_url: https://www.google.com/about/careers/applications/jobs/results
  notes: "Client-side rendered. Intercept the results XHR."
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://www.google.com/about/careers/applications/jobs/results?q=intern
        xhr_contains: "/api/"
        job_selector: "a[href*='/jobs/results/']"

- slug: meta
  display_name: Meta
  tier: hot
  enabled: false
  careers_url: https://www.metacareers.com/jobs
  notes: "GraphQL with a rotating doc_id — only the browser fallback is durable."
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://www.metacareers.com/jobs?q=intern
        xhr_contains: "graphql"
        job_selector: "a[href*='/jobs/']"

- slug: microsoft
  display_name: Microsoft
  tier: hot
  enabled: false
  careers_url: https://jobs.careers.microsoft.com/global/en/search
  notes: >-
    gcsservices.careers.microsoft.com serves a certificate that does not match
    its hostname, so a direct call fails TLS verification. Intercept the same
    request from inside a browser instead.
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://jobs.careers.microsoft.com/global/en/search?q=intern&l=en_us
        xhr_contains: "search/api/v1/search"
        items_path: "operationResult.result.jobs"
        field_map: {title: title, url: jobId, req_id: jobId}
        base_url: https://jobs.careers.microsoft.com/global/en/job/

- slug: tesla
  display_name: Tesla
  tier: hot
  enabled: false
  careers_url: https://www.tesla.com/careers/search/?type=3
  notes: "cua-api returns 403 to non-browser clients (edge bot check)."
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://www.tesla.com/careers/search/?query=intern
        xhr_contains: "cua-api/apps/careers"
        job_selector: "a[href*='/careers/search/job/']"

- slug: citadel
  display_name: Citadel
  tier: hot
  enabled: false
  careers_url: https://www.citadel.com/careers/open-opportunities/
  notes: "Behind a Cloudflare interstitial; a plain GET never reaches the page."
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://www.citadel.com/careers/open-opportunities/
        job_selector: "a[href*='/careers/details/']"

- slug: two-sigma
  display_name: Two Sigma
  tier: hot
  enabled: false
  careers_url: https://careers.twosigma.com/careers/OpenRoles
  notes: >-
    Not on Greenhouse, Lever, Ashby, SmartRecruiters or Workday — the page
    markup carries no ATS fingerprint at all. Open DevTools → Network →
    Fetch/XHR on the careers page and put the real request substring in
    xhr_contains.
  sources:
    - adapter: browser
      priority: 1
      config:
        url: https://careers.twosigma.com/careers/OpenRoles
        xhr_contains: "api"
        job_selector: "a[href*='/careers/']"

- slug: qualcomm
  display_name: Qualcomm
  tier: warm
  enabled: false
  careers_url: https://careers.qualcomm.com/
  notes: >-
    The qualcomm.wd5 tenant returns HTTP 422 for every site name tried
    (External, ExternalCareers, Careers, External_Career_Site, QualcommCareers).
    Read the real tenant and site off the careers URL before enabling.
  sources:
    - adapter: workday
      priority: 1
      config:
        host: https://qualcomm.wd5.myworkdayjobs.com
        tenant: qualcomm
        site: External
        search_text: intern
        min_interval_seconds: 300

# ═════════════════════════════════════════════════════════════════════════
# NOTES ON EXPANSION
#
# Warm tier (10-minute polls) is where the next ~200 companies go. Add them
# with `jobwatch discover <careers_url>`, which identifies the platform and
# verifies the guess against the live endpoint before you commit it.
#
# Do not promote a company to hot tier because it is prestigious. Promote it
# because its postings close fast. A company that leaves reqs open for three
# weeks gains nothing from a 60-second poll and costs 1,440 requests a day.
# The hot tier should stay near 30.
# ═════════════════════════════════════════════════════════════════════════
