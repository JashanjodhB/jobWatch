  # Re-enabled 2026-08-22 after two fixes.
  #
  # 1. `search_text: intern` alone returns Workday's capped total of 2000 —
  #    100 pages, past the adapter's MAX_PAGES=80, so it could never finish.
  #    The locationCountry facet below narrows it to the US: 211 reqs, 11 pages.
  #    Facet ids are per-tenant and come off the `facets` block of any response.
  # 2. Accenture serves a handful of rows with no externalPath (one reads
  #    {'bulletFields': ['R00342699', 'Location Negotiable']}). The workday
  #    adapter used to abort the whole scan on those; it now drops the row and
  #    logs a count, and still raises if an entire page looks that way.
  sources:
    - adapter: workday               # verified 2026-08-22: 208 postings kept, 3 unroutable rows dropped
      priority: 1
      config:
        host: "https://accenture.wd103.myworkdayjobs.com"
        tenant: accenture
        site: AccentureCareers
        search_text: intern
        applied_facets:
          locationCountry: ["bc33aa3152ec42d4995f4791a106ed09"]   # United States of America
        min_interval_seconds: 300

