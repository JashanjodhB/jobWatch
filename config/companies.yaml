- slug: comcast
  display_name: Comcast
  tier: cold
  careers_url: https://jobs.comcast.com/search-jobs
  # 2026-08-22: the Workday tenant answers 410 ERR_TENANT_MIGRATED and no other
  # wdN pod carries it — scanned wd1/2/3/10/12/101-103/501-503/505, all 422.
  # jobs.comcast.com is Radancy and is the live board; the Workday links left on
  # the page are only login/apply deep links.
  #
  # Watched WHOLE-BOARD on purpose. Comcast has 659 reqs and, right now, zero
  # matching `intern` — its campus roles are seasonal. A `k=intern` URL would
  # match nothing on page 1, and the html adapter treats an empty first page as
  # drift and raises, so the filtered form would fail permanently until the
  # season turned. max_pages covers 659 at 15 a page.
  sources:
    - adapter: html                  # verified 2026-08-22: 659 postings across 44 pages
      priority: 1
      config:
        url: https://jobs.comcast.com/search-jobs
        base_url: https://jobs.comcast.com
        job_selector: "section#search-results li"
        title_selector: "h2"
        location_selector: "span.job-location"
        page_param: p
        page_start: 1
        page_step: 1
        max_pages: 45
        min_interval_seconds: 900

