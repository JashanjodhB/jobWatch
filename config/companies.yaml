# ═════════════════════════════════════════════════════════════════════════
# FINTECH, PAYMENTS & CAPITAL MARKETS — added 2026-08-27
#
# The registry already carried the consumer-fintech tier (Stripe, Block,
# PayPal, Adyen, Plaid, Brex, Ramp, Chime, Affirm, SoFi, Wise, Marqeta,
# Robinhood, Betterment, Wealthfront) and the money-center banks, but not the
# card networks, the processors, or the crypto/embedded-finance layer. Visa
# was the largest single gap.
#
# Every entry below was called before being written down; the counts in the
# comments are what the endpoint actually returned on 2026-08-27.
#
# Two candidates were resolved and then deliberately DROPPED:
#   * western-union — greenhouse `westernunion` answers, but its only two
#     postings are titled "Test" and "Senior Recruiter, Talent Acquisition
#     (Test)". It is a sandbox board, not the real one (§13.10 stub boards).
#   * circle — the ashby board `circle` belongs to a different company
#     (7 PR/brand/marketplace roles). Circle Internet Financial is on Phenom
#     at careers.circle.com, which is what is configured below.
# ═════════════════════════════════════════════════════════════════════════

