# ─────────────────────────────────────────────────────────────────────────
# COMMERCIAL SPACE & DEFENCE TECH — verified 2026-09-08
#
# Seeded from "companies like Axiom Space": commercial stations, launch and
# propulsion, satellite operators and imaging, plus the defence-tech tier that
# already sits next to Anduril/Shield AI/Saronic above.
#
# Counts are what the endpoint returned on 2026-09-08. `early` counts titles
# that read as intern/co-op/new-grad; `match/review` is what filters.yaml
# actually kept, which is the number that decides whether an alert fires.
#
# Wrong-entity handles ruled out here — do NOT re-guess them (§13.10, and the
# stub/wrong-entity failure mode):
