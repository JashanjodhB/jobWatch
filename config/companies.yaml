# ─────────────────────────────────────────────────────────────────────────
# PHENOM — warm tier
# One POST per poll, so these are cheap. Both run with an EMPTY query: these
# boards are small enough to pull whole, and the classifier is a better filter
# than the tenant's own keyword search (Circle returns 0 rows for 'intern' but
# 61 for no keyword).
#
# `totalHits` LIES — check `data.jobs`, not the count. Fiserv was configured
# here and then removed: careers.fiserv.com reports totalHits=505 while
# returning an empty `jobs` array on every payload, pageId and siteType tried,
# so the source would have read as "no internships" forever (§13.10). It needs
# a different entry point and is a known gap, not a resolved company.
# ─────────────────────────────────────────────────────────────────────────

- slug: circle
