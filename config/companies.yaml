# ═════════════════════════════════════════════════════════════════════════
# WORKDAY — verified working
#
# Every tenant has its own host number (wd1/wd5/wd12…) and site name; read both
# off the real careers URL: https://TENANT.wdN.myworkdayjobs.com/en-US/SITE
#
# These are the most expensive sources in the registry. A full scan costs
# total/20 requests, so they carry an explicit interval floor.
# ═════════════════════════════════════════════════════════════════════════

- slug: nvidia
  display_name: NVIDIA
  tier: hot
  careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
  sources:
    - adapter: workday                # verified: 901 postings (~46 requests per scan)
      priority: 1
      config:
        host: https://nvidia.wd5.myworkdayjobs.com
        tenant: nvidia
        site: NVIDIAExternalCareerSite
        search_text: intern
        min_interval_seconds: 300
      fallback_adapter: browser

