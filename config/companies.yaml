- slug: hitachi
  display_name: Hitachi
  tier: warm
  careers_url: https://hitachi.wd1.myworkdayjobs.com/hitachi
  notes: >-
    Fixed and re-enabled 2026-09-01 after 98 failures and not one successful
    poll. `search_text` cannot work on this tenant: Workday full-text also
    matches "internal"/"international", and its `total` saturates at 2000 while
    offset 2100 still returns rows -- so the result set has no knowable end and
    the 80-page guard was right to fire. `limit` is capped at 20 here (25 gives
    HTTP 400), so a bigger page size is not available either.
    The facet is the fix: jobFamilyGroup=Intern_Group is Hitachi's own
    category, returns 156 of 156 -- bounded and complete -- in 8 pages, and
    classifies to the same 14 match/review postings that search_text
    "internship" (80) finds, minus only a stale 2023 req.
    If that opaque facet id ever stops matching, this returns an empty board
    rather than an error, so a collapse in posting count is the thing to watch.
  sources:
    - adapter: workday          # verified 2026-09-01: 156 hits, 14 match/review
      priority: 1
      config:
        host: https://hitachi.wd1.myworkdayjobs.com
        tenant: hitachi
        site: hitachi
        # jobFamilyGroup = "Intern_Group". Facet ids are opaque and per-tenant;
        # re-read them from the `facets` array of a searchText:"" response.
        applied_facets:
          jobFamilyGroup:
            - 44d3f33caa03108ff296a30d59c657e4
        min_interval_seconds: 900
  # feed: 3 active listing(s) - Fall 2026, Spring 2027, Summer 2027, Winter 2027
  # e.g. "Software Analyst Intern"

