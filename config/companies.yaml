  display_name: L3Harris
  tier: warm
  careers_url: https://careers.l3harris.com/en/search-jobs?k=intern
  sources:
    - adapter: html                   # verified 2026-08-22: 110 hits, 83 with intern/co-op in the title
      priority: 1
      config:
        url: https://careers.l3harris.com/en/search-jobs?k=intern
        base_url: https://careers.l3harris.com
        job_selector: "section#search-results li"
        title_selector: "h2"
        location_selector: "span.job-location"
        page_param: p
        page_start: 1
        page_step: 1

