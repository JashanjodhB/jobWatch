# ═════════════════════════════════════════════════════════════════════════
# NEEDS THE BROWSER FALLBACK — disabled until Playwright is installed
#
#     uv sync --extra browser && uv run playwright install chromium
#     then enable them on the Companies screen.
#
# Each of these was probed and has no usable unauthenticated JSON endpoint:
# the page is rendered client-side, sits behind a bot check, or serves its API
# from a host whose TLS certificate does not match. `xhr_contains` is the
# request substring to intercept once a browser has run the page (§11).
#
# They are disabled rather than deleted so the config records what was tried.
# Enabling one without Playwright installed is harmless — the source is skipped
# with a log line, not an error (§3).
# ═════════════════════════════════════════════════════════════════════════

- slug: google
  display_name: Google
  tier: hot
  enabled: true
  careers_url: https://www.google.com/about/careers/applications/jobs/results
  notes: >-
    Not client-side rendered after all -- a plain GET returns the results already
    in the markup, 20 to a page, paged with `page` from 1. Every class name on
    the page is a minified BOQ token that changes each deploy, so the selectors
    deliberately key off the href and the h3 instead. base_url must be the
    applications/ directory: the hrefs are relative and the search URL is not a
    directory. q=internship rather than q=intern because it is a strict superset
    here -- 47 results against 22, containing all 22 -- and the extra 25 are
    early-career reqs the classifier is there to judge.
  sources:
    - adapter: html                   # verified 2026-08-19
      priority: 1
      config:
        url: https://www.google.com/about/careers/applications/jobs/results?q=internship
        base_url: https://www.google.com/about/careers/applications/
        job_selector: "li:has(a[href*='jobs/results/'])"
        title_selector: "h3"
        location_selector: "p span"
        page_param: page
        page_start: 1
        page_step: 1
        max_pages: 10
        min_interval_seconds: 300     # 3 requests a poll

- slug: meta
  display_name: Meta
  tier: hot
  enabled: true
  careers_url: https://www.metacareers.com/jobs
  notes: >-
    GraphQL with a rotating doc_id and per-session lsd/jazoest tokens, and a
    plain GET of the jobs page is refused with a 400 -- so the browser really is
    the only way in. It is a good one, though: the results query answers with
    every match at once (378 for 'intern'), so this costs one page load and no
    pagination. The DOM fallback is gone because the rendered page builds no
    /jobs/ anchors at all; the XHR path is the only path.
  sources:
    - adapter: browser                # verified 2026-08-19: 378 postings
      priority: 1
      config:
        url: https://www.metacareers.com/jobs?q=intern
        xhr_contains: "graphql"
        items_path: "data.job_search_with_featured_jobs_v2.all_jobs"
        field_map: {title: title, url: id, req_id: id, locations: locations}
        base_url: https://www.metacareers.com/jobs/
        # 6000 raced the graphql XHR: alternating ok / "no XHR matching".
        # Raised 2026-08-22, but the intermittency is Meta's bot check, not the
        # timeout: on a challenged load the page renders a 185KB shell with zero
        # job anchors and fires no graphql call at all, so there is nothing for a
        # DOM `job_selector` to fall back to either. Run rate is 89 ok / 32 error
        # all-time and a good poll returns 379 postings, so this is a flaky
        # source, NOT a broken one — do not disable it on a red status line.
        wait_ms: 15000
        min_interval_seconds: 900     # a Chromium launch per poll, as with IBM

- slug: microsoft
  display_name: Microsoft
  tier: hot
  enabled: true
  careers_url: https://jobs.careers.microsoft.com/global/en/search
  notes: >-
    Migrated onto Eightfold: jobs.careers.microsoft.com now redirects to
    apply.careers.microsoft.com and the old search/api/v1/search XHR is gone, so
    the browser fallback is no longer needed. This is the "pcsx" flavour --
    results wrapped in `data`, camelCase fields, and `num` ignored (always 10 a
    page), which is why the adapter paginates on `count`. Apply links must come
    from `positionUrl`; the old /global/en/job/<id> form now redirects to the
    careers landing page.
  sources:
    - adapter: eightfold              # verified 2026-08-19: 41 hits, 31 real intern reqs
      priority: 1
      config:
        base: https://apply.careers.microsoft.com
        domain: microsoft.com
        path: /api/pcsx/search
        query: intern
        # 4 requests a poll; at the hot tier's 60s this drew an HTTP 504 within
        # the hour. Still well inside the window a hot req closes in.
        min_interval_seconds: 300

- slug: tesla
  display_name: Tesla
  tier: hot
  enabled: false
  careers_url: https://www.tesla.com/careers/search/?type=3
  notes: >-
    Still blocked as of 2026-08-19, and harder than the note below used to say:
    the edge check now refuses headless Chromium too, so the browser fallback
    does not get in either. /careers/search/, /cua-api/apps/careers/state and
    /cua-api/careers/search all answer 403 text/html -- the page never renders,
    so there is nothing to intercept. Re-check with a headed, non-automated
    profile before spending time here; nothing short of that changed the answer.
    The source row is disabled too as of 2026-09-01: `enabled: false` on the
    company alone never reached the database, because seed does not update
    rows that already exist, so this kept polling and failing for weeks after
    it was supposedly off.
  sources:
    - adapter: browser
      priority: 1
      enabled: false
      config:
        url: https://www.tesla.com/careers/search/?query=intern
        xhr_contains: "cua-api/apps/careers"
        job_selector: "a[href*='/careers/search/job/']"

- slug: citadel
  display_name: Citadel
  tier: hot
  enabled: true
  careers_url: https://www.citadel.com/careers/open-opportunities/
  notes: >-
    Cloudflare challenges on the User-Agent alone, not on JavaScript, and it
    rejects Playwright's default string as readily as jobwatch's own -- both get
    "Just a moment..." and a 403. Hence the explicit user_agent: without it the
    browser fallback fails exactly where the plain GET does. The page is
    server-rendered WordPress that makes no XHR at all, so there is nothing to
    intercept and xhr_contains is deliberately absent; the DOM path is the whole
    story. Every open role is on the one page, unpaged (10 when probed).
  sources:
    - adapter: browser                # verified 2026-08-19: 10 roles, 5 intern reqs
      priority: 1
      config:
        url: https://www.citadel.com/careers/open-opportunities/
        job_selector: "a.careers-listing-card"
        title_selector: ".careers-listing-card__title h2"
        location_selector: ".careers-listing-card__location"
        user_agent: >-
          Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
          (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
        min_interval_seconds: 900     # a Chromium launch for a 10-role board

- slug: two-sigma
  display_name: Two Sigma
  tier: hot
  enabled: true
  careers_url: https://careers.twosigma.com/careers/OpenRoles
  notes: >-
    The ATS is Avature, which fingerprints only in the page's own asset URLs --
    which is why the earlier sweep found nothing. It is server-rendered with no
    XHR at all, so no browser is needed. Fixed 10 rows a page: jobRecordsPerPage
    is accepted and then ignored, so jobOffset is the only way through the list
    (54 roles when probed).
  sources:
    - adapter: html                   # verified 2026-08-19: 54 roles across 6 pages
      priority: 1
      config:
        url: https://careers.twosigma.com/careers/OpenRoles
        base_url: https://careers.twosigma.com
        job_selector: "article.article--result"
        title_selector: "h3 a"
        location_selector: ".article__header__content__text span.paragraph_inner-span"
        page_param: jobOffset
        page_start: 0
        page_step: 10
        max_pages: 12
        min_interval_seconds: 300     # 6 requests a poll, the most of any source here

- slug: qualcomm
  display_name: Qualcomm
  tier: cold
  enabled: true
  careers_url: https://careers.qualcomm.com/
  notes: >-
    The wd5 tenant answered 422 to every site name because Qualcomm is no longer
    on Workday -- it moved to Eightfold, the same "pcsx" flavour as Microsoft,
    served from its own careers host. Ten results a page regardless of `num`.
  sources:
    - adapter: eightfold              # verified 2026-08-19: 57 intern hits
      priority: 1
      config:
        base: https://careers.qualcomm.com
        domain: qualcomm.com
        path: /api/pcsx/search
        query: intern

