# ═════════════════════════════════════════════════════════════════════════
# WORKDAY — verified working
#
# Every tenant has its own host number (wd1/wd5/wd12…) and site name; read both
# off the real careers URL: https://TENANT.wdN.myworkdayjobs.com/en-US/SITE
#
# These are the most expensive sources in the registry. A full scan costs
# total/20 requests, so they carry an explicit interval floor.
#
# They run on the COLD tier (3600s), not hot. Measured against poll_log: NVIDIA
# averages 50s per scan, Capital One 31s, Salesforce 31s — and because the
# concurrency semaphore wraps the whole paginated fetch, each one holds 1 of the
# 12 slots for that entire time and drags the tick out for everything else.
# Workday tenants also leave reqs open for weeks, so a 60s cadence bought
# nothing: these four alone were ~93% of all outbound requests.
# ═════════════════════════════════════════════════════════════════════════

- slug: nvidia
  display_name: NVIDIA
  tier: cold
  careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
  # 2026-08-22: re-probed after a `stuck_on_fallback` alarm. The tenant/site pair
  # below is unchanged and healthy — 962 postings, paginating cleanly to the last
  # page. The alarm's guess that the primary was "gone for good" was wrong.
  #
  # What actually happened: on 2026-08-15 the CXS endpoint answered five requests
  # with the HTML shell (HTTP 200, text/html) — a ~20 minute Workday blip. Five
  # failures tripped the flip to `browser`, and the browser fallback carried no
  # config, so it could not run: first "needs the 'browser' extra", then (once
  # Playwright was installed on 08-19) "missing required config key 'url'".
  #
  # Because `using_fallback` only clears on a *success* (pipeline.py
  # `_apply_source_state`), a fallback that can never succeed is a one-way door:
  # the primary is never retried. A 20-minute blip became a 7-day blackout.
  #
  # The fallback is removed rather than repaired, deliberately:
  #   * `browser` does one page load and captures the XHRs it sees — it does not
  #     paginate. On a 962-posting board it would return ~20 rows, a 98% short
  #     board that reads as a real count_drop.
  #   * The other three Workday tenants below carry no fallback either; plain
  #     backoff-and-retry is the correct response to a transient 200/text/html,
  #     and it recovers on its own.
  sources:
    - adapter: workday                # verified 2026-08-22: 962 postings (~49 requests per scan)
      priority: 1
      config:
        host: https://nvidia.wd5.myworkdayjobs.com
        tenant: nvidia
        site: NVIDIAExternalCareerSite
        search_text: intern
        min_interval_seconds: 300

- slug: salesforce
  display_name: Salesforce
  tier: cold
  careers_url: https://salesforce.wd12.myworkdayjobs.com/External_Career_Site
  sources:
    - adapter: workday                # verified: 736 postings
      priority: 1
      config:
        host: https://salesforce.wd12.myworkdayjobs.com
        tenant: salesforce
        site: External_Career_Site
        search_text: intern
        min_interval_seconds: 300

- slug: adobe
  display_name: Adobe
